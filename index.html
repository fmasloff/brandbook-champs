<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champs Elysées · Brandbook</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0c;--fg:#ece8e1;--muted:#9a958c;--line:#2a2927}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Jost",system-ui,sans-serif}
header{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px max(16px,4vw);background:rgba(13,13,12,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
h1{margin:0;font:500 1.25rem/1.1 "Cormorant Garamond",Georgia,serif;letter-spacing:.18em;text-transform:uppercase}
h1 span{color:var(--muted);font-family:"Jost",sans-serif;font-size:.7rem;letter-spacing:.3em;margin-left:.6em}
a.dl{color:var(--fg);text-decoration:none;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--fg);padding:9px 16px;white-space:nowrap}
a.dl:hover,a.dl:focus-visible{background:var(--fg);color:var(--bg)}
main{display:flex;flex-direction:column;gap:max(12px,2vw);padding:max(12px,2vw) max(16px,4vw) 48px;max-width:1500px;margin:0 auto}
main canvas{display:block;width:100%;height:auto;background:#1a1a19;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#msg{color:var(--muted);text-align:center;letter-spacing:.2em;font-size:.75rem;text-transform:uppercase;padding:40px 0}
footer{text-align:center;color:var(--muted);font-size:.75rem;letter-spacing:.15em;padding:0 16px 40px}
@media (max-width:520px){h1 span{display:none}}
</style>
</head>
<body>
<header>
<h1>Champs Elysées<span>Brandbook</span></h1>
<a class="dl" href="Champs_Elysees-Brandbook_resumen.pdf" target="_blank" rel="noopener">Descargar PDF</a>
</header>
<main id="pages"><p id="msg">Cargando…</p></main>
<footer>CHAMPS ELYSÉES / BRANDBOOK</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
(async function(){
  var box=document.getElementById("pages"),msg=document.getElementById("msg");
  try{
    var pdf=await pdfjsLib.getDocument("Champs_Elysees-Brandbook_resumen.pdf").promise;
    msg.remove();
    var scale=Math.min(2.5,Math.max(1.2,(Math.min(box.clientWidth,1500)*(window.devicePixelRatio||1))/994));
    for(var i=1;i<=pdf.numPages;i++){
      var page=await pdf.getPage(i),vp=page.getViewport({scale:scale});
      var c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
      c.setAttribute("aria-label","Página "+i);box.appendChild(c);
      await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    }
  }catch(e){msg.textContent="No se pudo cargar el documento. Usá el botón Descargar PDF.";}
})();
</script>
</body>
</html>
